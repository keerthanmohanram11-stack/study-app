<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="js/common.js"></script>
</head>
<body>
<main class="app">

  <div>
    <h1>⚙️ Settings</h1>
    <p class="muted">Make StudyBuddy work your way.</p>
  </div>

  <div class="glass card" style="display: flex; flex-direction: column; gap: 10px">
    <label for="name">Your name</label>
    <input type="text" id="name" maxlength="30">
    <label>Your class</label>
    <div class="pills" id="levelBox">
      <button class="pill" data-value="Class 6 to 8">Class 6–8</button>
      <button class="pill" data-value="Class 9 to 10">Class 9–10</button>
      <button class="pill" data-value="Class 11 to 12">Class 11–12</button>
      <button class="pill" data-value="College">College</button>
      <button class="pill" data-value="Everyone">Other</button>
    </div>
  </div>

  <div class="glass card" style="display: flex; flex-direction: column; gap: 10px">
    <label>🤖 Your AI expert</label>
    <div class="pills" id="expertBox">
      <button class="pill" data-value="General tutor">🎓 All-rounder</button>
      <button class="pill" data-value="Maths expert">➗ Maths</button>
      <button class="pill" data-value="Science expert">🔬 Science</button>
      <button class="pill" data-value="English and language coach">📖 English</button>
      <button class="pill" data-value="History and social science expert">🌍 Social science</button>
      <button class="pill" data-value="Coding mentor">💻 Coding</button>
      <button class="pill" data-value="Exam coach">🏆 Exam coach</button>
    </div>
    <label>😊 Personality</label>
    <div class="pills" id="personalityBox">
      <button class="pill" data-value="Friendly buddy">Friendly buddy</button>
      <button class="pill" data-value="Calm teacher">Calm teacher</button>
      <button class="pill" data-value="Funny and fun">Funny and fun</button>
      <button class="pill" data-value="Strict coach">Strict coach</button>
    </div>
    <label>✏️ How it explains (pick any)</label>
    <div class="pills" id="styleBox">
      <button class="pill" data-value="Step by step">Step by step</button>
      <button class="pill" data-value="Real-life examples">Real-life examples</button>
      <button class="pill" data-value="Hints before full answers">Hints first</button>
      <button class="pill" data-value="Short and simple">Short and simple</button>
    </div>
  </div>

  <div class="glass card" style="display: flex; flex-direction: column; gap: 10px">
    <label>🌗 Look</label>
    <div class="pills" id="themeBox">
      <button class="pill" data-value="dark">🌙 Dark glass</button>
      <button class="pill" data-value="light">☀️ Light glass</button>
    </div>
  </div>

  <button class="btn" id="saveBtn" style="width: 100%">Save changes</button>
  <p id="saved" class="muted" style="text-align: center; display: none">✓ Saved</p>

  <button class="btn btn-ghost" id="resetBtn" style="width: 100%">Reset my progress</button>

</main>

</body>
</html>
