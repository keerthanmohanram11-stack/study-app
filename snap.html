<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snap &amp; Learn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="js/common.js"></script>
</head>
<body>
<main class="app">

  <div>
    <h1>📸 Snap &amp; Learn</h1>
    <p class="muted">Take a photo of your notes, textbook or solved answer.</p>
  </div>

  <!-- Photo picker -->
  <label for="photo" class="glass card" style="display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer; text-align: center">
    <svg width="64" height="64" viewBox="0 0 52 52" aria-hidden="true"><rect x="5" y="14" width="40" height="28" rx="9" fill="#FF8FC4"/><rect x="16" y="9" width="14" height="8" rx="3" fill="#FF8FC4"/><circle cx="25" cy="28" r="9" fill="#FFFFFF"/><circle cx="25" cy="28" r="5" fill="#8B7CF6"/></svg>
    <span class="title" style="font-size: 16px">Tap to take or choose a photo</span>
    <span class="muted" style="font-size: 13px">JPG or PNG</span>
    <img id="preview" alt="Your photo" style="display: none; max-width: 100%; max-height: 280px; border-radius: 16px">
  </label>
  <input type="file" id="photo" accept="image/*" style="display: none">

  <!-- What to do -->
  <div class="grid-2">
    <button class="btn" data-mode="explain">💡 Explain it</button>
    <button class="btn" data-mode="notes">📝 Short notes</button>
    <button class="btn btn-ghost" data-mode="mistake">🔍 Find my mistake</button>
    <button class="btn btn-ghost" data-mode="questions">❓ Make questions</button>
  </div>

  <!-- AI answer -->
  <div id="resultBox" class="glass card answer" style="display: none"></div>

</main>

<nav class="nav glass" aria-label="Main menu">
  <a href="index.html" aria-label="Home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></a>
  <a href="tutor.html" aria-label="AI Tutor"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></a>
  <a href="quiz.html" aria-label="Quiz"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 9l2 2 4-4M9 16h6"/></svg></a>

</nav>

<script src="js/snap.js"></script>
</body>
</html>
