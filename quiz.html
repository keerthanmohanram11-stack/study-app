<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz Me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="js/common.js"></script>
</head>
<body>
<main class="app">

  <div>
    <h1>📝 Quiz Me</h1>
    <p class="muted">Pick a topic. The AI makes questions or flashcards for you.</p>
  </div>

  <!-- Setup -->
  <div class="glass card" style="display: flex; flex-direction: column; gap: 12px">
    <div class="pills" id="modeBox">
      <button class="pill" data-value="quiz">✅ Quiz</button>
      <button class="pill" data-value="cards">🃏 Flashcards</button>
    </div>
    <label for="topic">Topic</label>
    <input type="text" id="topic" placeholder="e.g. Fractions, Photosynthesis, World War 2">
    <div class="row">
      <button class="btn" id="startBtn" style="flex: 1">Start</button>
      <button class="btn btn-ghost" id="weakBtn" style="flex: 1">🎯 Fix my weak spot</button>
    </div>
  </div>

  <!-- Quiz or cards appear here -->
  <div id="area"></div>

</main>

<nav class="nav glass" aria-label="Main menu">
