<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Tutor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="js/common.js"></script>
</head>
<body>
<main class="app" style="padding-bottom: 200px">

  <!-- Header -->
  <div class="glass row" style="padding: 10px 12px; border-radius: 22px">
    <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="22" fill="var(--tint)"/><rect x="9" y="12" width="26" height="19" rx="8" fill="#8B7CF6"/><circle cx="17" cy="21" r="2" fill="#1E1B4B"/><circle cx="27" cy="21" r="2" fill="#1E1B4B"/><path d="M19 26 q3 2 6 0" stroke="#1E1B4B" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
    <div style="flex: 1">
      <h3>AI Tutor</h3>
      <p class="muted" id="expertName" style="font-size: 12px">General tutor</p>
    </div>
    <button class="icon-btn" id="speakBtn" aria-label="Read answers out loud">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
    </button>
  </div>

  <!-- Messages -->
  <div id="chat">
    <div class="glass bubble ai">Hi! 👋 Ask me anything you're studying. I'll explain it step by step.</div>
  </div>

  <!-- Quick buttons -->
  <div class="pills">
    <button class="pill" data-quick="Explain that again in a simpler way, like I'm 10 years old.">🧸 Explain simpler</button>
    <button class="pill" data-quick="Give me one real-life example of that.">🌍 Give an example</button>
    <button class="pill" id="quizMe">📝 Quiz me on this</button>
  </div>

</main>

<!-- Typing bar -->
<div class="input-bar glass" style="border-radius: 26px">
  <button class="icon-btn" id="micBtn" aria-label="Speak your question">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
  </button>
  <label for="question" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Your question</label>
  <input type="text" id="question" placeholder="Ask any doubt…">
  <button class="icon-btn on" id="sendBtn" aria-label="Send">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </button>
</div>

<nav class="nav glass" aria-label="Main menu">
  <a href="index.html" aria-label="Home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></a>
  <a href="tutor.html" class="active" aria-label="AI Tutor"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></a>
  <a href="quiz.html" aria-label="Quiz"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 9l2 2 4-4M9 16h6"/></svg></a>
  <a href="progress.html" aria-label="Progress"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></a>
  <a href="settings.html" aria-label="Settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
</nav>

<script src="js/tutor.js"></script>
</body>
</html>
